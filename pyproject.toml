[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracesplit-research"
version = "0.1.0"
description = "A checked tabular machine-learning language with inspectable execution evidence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ali Al Bataineh"}]
license = "MIT"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2", "scikit-learn>=1.6,<2", "lark>=1.2,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
research = ["matplotlib>=3.9,<4"]

[project.scripts]
tracesplit = "tracesplit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracesplit = ["grammar.lark", "replay_template.py.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
